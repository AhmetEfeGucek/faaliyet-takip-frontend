<div style="max-width: 400px; margin: 60px auto; padding: 30px; border: 1px solid #e0e0e0; border-radius: 10px; font-family: system-ui, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="text-align: center; margin-bottom: 10px;">E-posta Doğrulama</h2>
  <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;">E-posta adresinize gönderilen 6 haneli doğrulama kodunu giriniz.</p>

  <div *ngIf="message" style="color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 15px;">{{ message }}</div>
  <div *ngIf="error" style="color: #c62828; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 15px;">{{ error }}</div>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">E-posta</label>
      <input type="email" [(ngModel)]="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">6 Haneli Kod</label>
      <input type="text" [(ngModel)]="code" name="code" placeholder="123456" required maxlength="6" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center; letter-spacing: 4px; font-size: 18px;" />
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      Hesabı Doğrula
    </button>
  </form>
</div>
