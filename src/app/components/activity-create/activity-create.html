<div class="create-container">
  <div class="create-card">

    <div class="card-header">
      <h2>Yeni Faaliyet Oluştur</h2>
      <a routerLink="/dashboard" class="btn-back">← Geri Dön</a>
    </div>

    <!-- Hata Bildirim Kutusu -->
    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="createActivity()">
      <div class="form-group">
        <label for="title">Faaliyet Başlığı *</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="title"
          placeholder="Örn: Hafta Sonu Halı Saha Maçı"
          required
          class="form-control" />
      </div>

      <div class="form-group">
        <label for="categoryId">Kategori *</label>
        <select
          id="categoryId"
          name="categoryId"
          [(ngModel)]="categoryId"
          class="form-control">
          <option *ngFor="let cat of categories" [value]="cat.id">
            {{ cat.name }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="eventDateOnly">Faaliyet Tarihi *</label>
          <input
            type="date"
            id="eventDateOnly"
            name="eventDateOnly"
            [(ngModel)]="eventDateOnly"
            required
            class="form-control" />
        </div>

        <div class="form-group flex-1">
          <label for="eventTimeOnly">Saat *</label>
          <input
            type="time"
            id="eventTimeOnly"
            name="eventTimeOnly"
            [(ngModel)]="eventTimeOnly"
            required
            class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Açıklama</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="description"
          rows="3"
          placeholder="Faaliyet hakkında detaylı bilgi giriniz..."
          class="form-control"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/dashboard" class="btn-cancel">İptal</button>
        <button type="submit" [disabled]="isLoading" class="btn-submit">
          {{ isLoading ? 'Kaydediliyor...' : 'Faaliyeti Kaydet' }}
        </button>
      </div>
    </form>

  </div>
</div>
